<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KPIs 2026 | Main</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <button id="toggleSidebar" class="icon-btn" aria-label="Colapsar sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <h2>KPIs</h2>
        </div>

        <nav class="menu">
          <button class="menu-item active" data-page="pages/dashboard.html" data-title="Dashboard" data-subtitle="Filtros globales: aplican a todos los indicadores.">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 13h8V3H3v10zm10 8h8V3h-8v18zM3 21h8v-6H3v6z" />
            </svg>
            <span>Dashboard</span>
          </button>
          <button class="menu-item" data-page="pages/economico.html" data-title="Económico" data-subtitle="Indicadores económicos con los mismos filtros globales.">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 1l3 6 6 .9-4.5 4.4L17.5 19 12 16l-5.5 3 1-6.7L3 7.9 9 7z" />
            </svg>
            <span>Económico</span>
          </button>
          <button class="menu-item" data-page="pages/costos-proviciones.html" data-title="Costos y proviciones" data-subtitle="Indicadores de costos y provisiones con filtros globales.">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h16v4H4zm0 6h10v10H4zm12 0h4v10h-4z" />
            </svg>
            <span>Costos y proviciones</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <p id="userGreeting">-</p>
          <button id="logoutBtn" class="btn-outline">Cerrar sesión</button>
        </div>
      </aside>

      <section class="content-panel">
        <header class="topbar topbar-with-filters">
          <div class="topbar-title">
            <h1 id="moduleTitle">Dashboard</h1>
            <p class="topbar-sub" id="moduleSubtitle">Filtros globales: aplican a todos los indicadores.</p>
          </div>
          <div class="global-filters" id="dashboardFilters">
            <div class="filter-field">
              <label for="filterClienteBtn">Cliente</label>
              <div class="multi-filter" id="filterCliente"></div>
            </div>
            <div class="filter-field">
              <label for="filterMesBtn">Mes</label>
              <div class="multi-filter" id="filterMes"></div>
            </div>
          </div>
        </header>
        <iframe id="moduleFrame" src="" title="Módulo activo"></iframe>
      </section>
    </div>

    <script src="scripts/config.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
